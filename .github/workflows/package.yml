name: Test Python package

on:
  push:
    paths:
      - genemapkit/**
      - tests/**
      - pyproject.toml
      - requirements.txt
      - .github/workflows/package.yml
  pull_request:
    paths:
      - genemapkit/**
      - tests/**
      - pyproject.toml
      - requirements.txt
      - .github/workflows/package.yml
  workflow_dispatch:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package from source
        run: python -m pip install .

      - name: Verify installed entry points
        run: |
          genemapkit --help
          python -m genemapkit --help
          python -c "import genemapkit; print(genemapkit.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: genemapkit-wheel
          path: dist/*.whl

