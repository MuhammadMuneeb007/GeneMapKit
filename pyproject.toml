[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genemapkit"
version = "1.0.0"
description = "Reproducible, provenance-aware human gene identifier conversion and benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "GeneMapKit Development Team"},
]
keywords = [
  "bioinformatics",
  "gene identifiers",
  "identifier mapping",
  "Ensembl",
  "NCBI",
  "HGNC",
  "UniProt",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=2.0.0",
  "requests>=2.32.0,<3",
  "chardet<6",
  "click>=8.0.0",
  "tqdm>=4.64.0",
  "colorlog>=6.6.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5,<10"]
dev = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
genemapkit = "genemapkit.cli:cli"

[project.urls]
Homepage = "https://muhammadmuneeb007.github.io/GeneMapKit/"
Repository = "https://github.com/MuhammadMuneeb007/GeneMapKit"
Documentation = "https://muhammadmuneeb007.github.io/GeneMapKit/"
Issues = "https://github.com/MuhammadMuneeb007/GeneMapKit/issues"

[tool.setuptools.packages.find]
include = ["genemapkit*"]
